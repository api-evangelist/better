name: Better
description: >-
  Better (Better Home & Finance Company, NASDAQ: BETR) is a New York-based digital
  homeownership company founded in 2014 by Vishal Garg. Its Tinman-powered platform
  delivers an end-to-end online mortgage experience - purchase loans, refinancing,
  cash-out refinancing, HELOCs, VA loans, and crypto-backed mortgages - alongside
  real estate agent matching, title and closing services, and homeowners insurance
  through Better+. Better became a Fannie Mae-approved seller/servicer in 2016, has
  funded over $100B in mortgages, and launched One Day Mortgage in 2023. It is backed
  by SoftBank Vision Fund, Bond Capital, Ally, Citi, Ping An, Goldman Sachs, KPCB, and
  American Express. Better publishes no public developer API; this profile captures its
  public web, consumer identity (AWS Cognito OIDC), and domain-security surface.
